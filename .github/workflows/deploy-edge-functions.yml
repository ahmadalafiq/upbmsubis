name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kod terkini dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pasang Supabase CLI menggunakan Node.js/NPM (Lebih stabil)
      - name: Install Supabase CLI
        run: npm install -g supabase

      # 3. Deploy Edge Function 'ai-chat' ke Supabase
      - name: Deploy ai-chat function
        run: |
          supabase functions deploy ai-chat --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
